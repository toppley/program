name: linuxdo-rss
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linuxdo-rss
  cancel-in-progress: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and publish
        run: |
          set -e
          mkdir out && cd out
          got=0
          for f in latest top; do
            for i in 1 2 3; do
              code=$(curl -sL -A "Mozilla/5.0 (compatible; RSS mirror)" -o $f.xml -w "%{http_code}" "https://linux.do/$f.rss" || true)
              if [ "$code" = "200" ] && python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('$f.xml')"; then got=$((got+1)); break; fi
              rm -f $f.xml; sleep 15
            done
            echo "$f: HTTP $code"
          done
          [ $got -gt 0 ] || exit 1
          git init -q -b rss
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "update $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rss
          for f in latest top; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rss/$f.xml" > /dev/null || true
          done
